<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>무기 위치 에디터</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1f2e; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
    #editor-bar {
      position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
      z-index: 30; display: flex; gap: 8px; align-items: center;
      background: rgba(10,14,30,0.92); border: 1px solid #3a5a9a; border-radius: 8px;
      padding: 8px 12px; color: #cfe; font-size: 13px;
    }
    #editor-bar select, #editor-bar button {
      background: #05080f; color: #cfe; border: 1px solid #345; border-radius: 4px;
      padding: 4px 8px; cursor: pointer; font-size: 13px;
    }
    #editor-bar button:hover { background: #142040; }
    #editor-hint {
      position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
      z-index: 30; color: #7a90b0; font-size: 12px;
    }
  </style>
</head>
<body>
  <div id="editor-bar">
    <label>캐릭터 <select id="char-select"></select></label>
    <button id="btn-idle">Idle</button>
    <button id="btn-walk">Walk</button>
    <button id="btn-attack">Attack</button>
  </div>
  <div id="editor-hint">드래그: 회전 · 휠: 줌 · 좌상단 패널에서 무기 선택 후 조정</div>
  <script type="module" src="/src/dev/weaponEditor.ts"></script>
</body>
</html>
